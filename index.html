<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <button id="mem1-button">Memory #1</button>
    <button id="mem2-button">Memory #2</button>
    <button id="mem3-button">Memory #3</button>
    <h1 class="top">My Top 3 Memories of <span id="jit">This Year</span></h1>
    <ol>
      <li>
        <h3 id="mem1">SWEET 16!!</h3>
        <p></p>
        <img
          id="s16"
          width="200"
          src="https://cdn.glitch.global/2980ade0-6fbf-4ad0-b9b1-7fbc8fca71b5/A6F73DBC-CCE0-4C14-810F-AB3A634B5575.jpeg?v=1745410976747"
          style="display: none"
        />
      </li>

      <li>
        <h3 id="mem2">Halloween</h3>
        <p></p>
        <img
          width="200"
          src="https://cdn.glitch.global/2980ade0-6fbf-4ad0-b9b1-7fbc8fca71b5/IMG_5485.jpeg?v=1745411144449"
        />
      </li>

      <li>
        <h3 id="mem3">Cannes Film festival</h3>
        <p>More about this memory</p>
        <img
          width="200"
          src="https://cdn.glitch.global/2980ade0-6fbf-4ad0-b9b1-7fbc8fca71b5/FullSizeRender.jpeg?v=1745423181577"
        />
      </li>
    </ol>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      $("#mem1-button").click(function () {
        $("#mem1").css("color", "purple");
      });

      $("#mem2-button").click(function () {
        $("#mem2").css("color", "blue");
      });

      $("#mem3-button").click(function () {
        $("#mem3").css("color", "green");
      });
      $(".top").text("Littiest mems of dis yur");
      $("h1").html("<strong>Littiest mems</strong> <span id=jit></span>");
      $("#jit").html("<u>dis yur</u>");
      $("#s16").show(2000);
      $("img").attr(
        "src",
        "https://cdn.glitch.global/2980ade0-6fbf-4ad0-b9b1-7fbc8fca71b5/IMG_5485.jpeg?v=1745411144449"
      );
    </script>
  </body>
</html>
